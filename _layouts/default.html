<!DOCTYPE html>
<html>

  {% include head.html %}

  <body>

    {% include header.html %}
    {% include topbar.html %}

    <div class="container">
      <div class="row">
        <div class="one-half column" style="margin-top: 5%">
          <h1 class="h1_title">
                  {{ page.title }}
                <div class="h1_title_corner"></div>
                </h1>
                <p class="page-description">{{ page.description }}</p>
        </div>
        <div class="screenshot-wrapper">
          <div class="screenshot-size-cover" style="background-image: url({{ post.screenshot }}) ;"></div>
        </div>
        <div class="one-half offset-by-one-half column">
          <a href="{{ post.download }}" target="_blank">download [{{post.file-size}}]</a>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="row">
        <div class="nine columns">
          <section class="gage_content">
            {{ content }}
          </section>
        </div>

        <div class="three columns">
          <section class="stiky_content">
            <img src="/assets/images/tsr_snakes_mini.gif">
          </section>
        </div>
      </div>
    </div>

    {% include footer.html %}

  </body>

</html>
